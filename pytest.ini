[pytest]
# Run tests from the project root so `from backend.main import app` resolves.
testpaths = tests
python_files = test_*.py
python_functions = test_*

# -q: quiet. -ra: show a summary of every non-passing test.
#
# -m "not live" excludes tests marked `live`, which call the real Groq API.
# Without this, a bare `pytest` spends real money and fails when offline.
# Deselecting by default makes the safe path the automatic one; live tests
# are then opt-in with `pytest -m live`, which overrides this flag.
addopts = -q -ra -m "not live"
